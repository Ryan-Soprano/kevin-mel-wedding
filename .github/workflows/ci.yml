name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk:0.14.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Prepare test container images
        timeout-minutes: 3
        run: |
          # Recheck Alpine/Ryuk helper versions when upgrading Testcontainers.
          # Docker Official Images on ECR Public avoid shared Docker Hub pull limits.
          docker pull public.ecr.aws/docker/library/postgres:17
          docker tag public.ecr.aws/docker/library/postgres:17 postgres:17
          docker pull public.ecr.aws/docker/library/alpine:3.17
          docker tag public.ecr.aws/docker/library/alpine:3.17 alpine:3.17
          docker pull "$TESTCONTAINERS_RYUK_CONTAINER_IMAGE"
          docker image inspect postgres:17 alpine:3.17 "$TESTCONTAINERS_RYUK_CONTAINER_IMAGE" --format '{{.RepoTags}} {{.Id}}'

      - name: Install audio verification runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run backend tests
        run: ./backend/mvnw -f backend/pom.xml --batch-mode test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend API contract
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
