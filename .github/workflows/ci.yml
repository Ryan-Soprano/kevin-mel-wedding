name: Release verification 01fc4e5

on:
  pull_request:
  push:
    branches:
      - feature/release-verification-01fc4e5

permissions:
  contents: read

# Superseded PR checks can stop; every main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk:0.14.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: 01fc4e5e50d3f2f1bab35aace7feec0ad993dc53

      - name: Confirm exact release commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Checked out release commit: $actual"
          test "$actual" = "01fc4e5e50d3f2f1bab35aace7feec0ad993dc53"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Set weekly image cache key
        id: image-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore test container images
        id: test-images-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/test-container-images.tar
          key: ci-images-${{ runner.os }}-${{ runner.arch }}-${{ steps.image-cache-week.outputs.week }}-${{ hashFiles('scripts/prepare-ci-images.sh') }}

      - name: Prepare test container images
        timeout-minutes: 5
        run: bash scripts/prepare-ci-images.sh "$RUNNER_TEMP/test-container-images.tar"

      - name: Save test container images
        if: steps.test-images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/test-container-images.tar
          key: ${{ steps.test-images-cache.outputs.cache-primary-key }}

      - name: Install audio verification runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run backend tests
        run: ./backend/mvnw -f backend/pom.xml --batch-mode test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: 01fc4e5e50d3f2f1bab35aace7feec0ad993dc53

      - name: Confirm exact release commit
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Checked out release commit: $actual"
          test "$actual" = "01fc4e5e50d3f2f1bab35aace7feec0ad993dc53"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test operational script helpers
        working-directory: .
        run: node --test scripts/*.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend API contract
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
