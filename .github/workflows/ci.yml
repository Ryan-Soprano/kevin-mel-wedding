name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR checks can stop; every main push keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk:0.14.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Set weekly image cache key
        id: image-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore test container images
        id: test-images-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/test-container-images.tar
          key: ci-images-${{ runner.os }}-${{ runner.arch }}-${{ steps.image-cache-week.outputs.week }}-${{ hashFiles('scripts/prepare-ci-images.sh') }}

      - name: Prepare test container images
        timeout-minutes: 5
        run: bash scripts/prepare-ci-images.sh "$RUNNER_TEMP/test-container-images.tar"

      - name: Save test container images
        if: steps.test-images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/test-container-images.tar
          key: ${{ steps.test-images-cache.outputs.cache-primary-key }}

      - name: Install audio verification runtime
        run: |
          set -euo pipefail

          # Keep APT's signature verification and bound only index/archive acquisition.
          apt_options=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::AllowInsecureRepositories=false
            -o APT::Get::AllowUnauthenticated=false
          )

          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=5s 240s \
            bash -euo pipefail -s -- "${apt_options[@]}" <<'APT_ACQUIRE'
          apt_options=("$@")

          acquire() {
            timeout --signal=TERM --kill-after=5s 100s bash -euo pipefail -c '
              apt-get "$@" update --error-on=any
              apt-get "$@" install --download-only --no-install-recommends -y ffmpeg
            ' apt-acquire "${apt_options[@]}"
          }

          if acquire; then
            exit 0
          fi

          # One fallback on the disposable x64 Ubuntu runner. Preserve suites, components,
          # Ubuntu keyrings, unrelated repositories and the distinct security endpoint.
          source /etc/os-release
          if [[ "${ID:-}" != ubuntu || "$(dpkg --print-architecture)" != amd64 ]]; then
            echo 'Required Ubuntu x64 mirror fallback is unavailable.' >&2
            exit 1
          fi
          azure_pattern='https?://azure\.archive\.ubuntu\.com/ubuntu(/|[[:space:]]|$)'
          changed=0
          for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$file" ]] && grep -Eq "$azure_pattern" "$file"; then
              sed -E -i "s#${azure_pattern}#https://archive.ubuntu.com/ubuntu\\1#g" "$file"
              changed=1
            fi
          done
          if [[ "$changed" != 1 ]]; then
            echo 'Expected Azure Ubuntu source was not found; refusing an unrelated source change.' >&2
            exit 1
          fi
          echo 'Retrying acquisition once through the official Ubuntu archive.'
          acquire
          APT_ACQUIRE

          # All archives are already verified/downloaded. Do not wrap active dpkg work in
          # a new helper timeout or retry an interrupted installation. The job retains its
          # existing 15-minute backstop and must fail if installation or verification fails.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" \
            install --no-download --no-install-recommends -y ffmpeg
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Run backend tests
        run: ./backend/mvnw -f backend/pom.xml --batch-mode test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test operational script helpers
        working-directory: .
        run: node --test scripts/*.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend API contract
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
