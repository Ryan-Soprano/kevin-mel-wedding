# Production runs behind the approved Render HTTPS proxy.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Require the retained production target explicitly; never fall back to local data.
spring.datasource.url=${MEMORY_ARCHIVE_DB_URL}
spring.datasource.username=${MEMORY_ARCHIVE_DB_USERNAME}
spring.datasource.password=${MEMORY_ARCHIVE_DB_PASSWORD}

# Preserve the measured single-decoder memory budget during promotion.
archive.media.max-concurrent-finalizations=1
