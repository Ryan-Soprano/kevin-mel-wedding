# Activate only behind the approved HTTPS staging proxy.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework

# Required, server-only settings. Use a JDBC URL without embedded credentials.
spring.datasource.url=${MEMORY_ARCHIVE_DB_URL}
spring.datasource.username=${MEMORY_ARCHIVE_DB_USERNAME}
spring.datasource.password=${MEMORY_ARCHIVE_DB_PASSWORD}

# Bound overlapping read/decode/publish work without changing file or batch limits.
archive.media.max-concurrent-finalizations=1
