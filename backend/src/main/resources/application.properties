spring.application.name=memory-archive

spring.datasource.url=${MEMORY_ARCHIVE_DB_URL:jdbc:postgresql://127.0.0.1:5433/memory_archive}
spring.datasource.username=${MEMORY_ARCHIVE_DB_USERNAME:memory_archive}
spring.datasource.password=${MEMORY_ARCHIVE_DB_PASSWORD:local_dev_only}

# Opt-in only. These server environment values must never enter Vite/browser configuration.
archive.storage.enabled=${MEMORY_ARCHIVE_STORAGE_ENABLED:false}
archive.storage.endpoint=${MEMORY_ARCHIVE_R2_ENDPOINT:}
archive.storage.bucket=${MEMORY_ARCHIVE_R2_BUCKET:}
archive.storage.access-key-id=${MEMORY_ARCHIVE_R2_ACCESS_KEY_ID:}
archive.storage.secret-access-key=${MEMORY_ARCHIVE_R2_SECRET_ACCESS_KEY:}
