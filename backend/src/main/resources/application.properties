spring.application.name=memory-archive
spring.profiles.active=${MEMORY_ARCHIVE_ENVIRONMENT:local}

archive.environment=${MEMORY_ARCHIVE_ENVIRONMENT:local}
archive.revealed=${MEMORY_ARCHIVE_REVEALED:false}
archive.public-origin=${MEMORY_ARCHIVE_PUBLIC_ORIGIN:}
archive.login-throttle-secret=${MEMORY_ARCHIVE_LOGIN_THROTTLE_SECRET:}

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=MEMORY_ARCHIVE_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
# Security DEBUG/TRACE can include session identifiers; keep framework diagnostics redacted.
logging.level.org.springframework.security=WARN

spring.datasource.url=${MEMORY_ARCHIVE_DB_URL:jdbc:postgresql://127.0.0.1:5433/memory_archive}
spring.datasource.username=${MEMORY_ARCHIVE_DB_USERNAME:memory_archive}
spring.datasource.password=${MEMORY_ARCHIVE_DB_PASSWORD:local_dev_only}

# Opt-in only. These server environment values must never enter Vite/browser configuration.
archive.storage.enabled=${MEMORY_ARCHIVE_STORAGE_ENABLED:false}
archive.storage.endpoint=${MEMORY_ARCHIVE_R2_ENDPOINT:}
archive.storage.bucket=${MEMORY_ARCHIVE_R2_BUCKET:}
archive.storage.access-key-id=${MEMORY_ARCHIVE_R2_ACCESS_KEY_ID:}
archive.storage.secret-access-key=${MEMORY_ARCHIVE_R2_SECRET_ACCESS_KEY:}

# SEC-01: existing upload permissions can finish; new photo intents/grants can be paused.
archive.media.uploads-paused=${MEMORY_ARCHIVE_UPLOADS_PAUSED:false}
archive.media.max-original-bytes=${MEMORY_ARCHIVE_MAX_ORIGINAL_BYTES:7500000000}
archive.media.max-staging-bytes=${MEMORY_ARCHIVE_MAX_STAGING_BYTES:7500000000}
archive.media.max-concurrent-finalizations=${MEMORY_ARCHIVE_MAX_CONCURRENT_FINALIZATIONS:2}

# Audio admission is opt-in until real device/provider acceptance. Original recovery remains available.
archive.audio.enabled=${MEMORY_ARCHIVE_AUDIO_ENABLED:false}
archive.audio.ffmpeg=${MEMORY_ARCHIVE_FFMPEG:ffmpeg}
archive.audio.ffprobe=${MEMORY_ARCHIVE_FFPROBE:ffprobe}

# Local/test maintenance is off. Production deletion requires this reviewed maintenance path.
archive.retention.enabled=${MEMORY_ARCHIVE_RETENTION_ENABLED:false}
archive.retention.interval-ms=${MEMORY_ARCHIVE_RETENTION_INTERVAL_MS:300000}
